<svg xmlns="http://www.w3.org/2000/svg" width="830" height="230" viewBox="0 0 830 230" font-family="'JetBrains Mono','Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest">
          <metadata>
                    <c2pa:manifest></c2pa:manifest>
          </metadata>
          <rect width="830" height="230" fill="#231f29" stroke="#4c5aa8" stroke-width="2" />
          <rect x="18" y="18" width="3" height="194" fill="#f0485a" />
          <text x="38" y="34" font-size="13" font-weight="bold" fill="#f0485a" letter-spacing="1.5">LICENSE: MIT / OPEN SOURCE</text>
          <g font-size="12" fill="#cfcfd8">
                    <text x="38" y="64">Software, systems and interfaces; thinking, analyzing and coding.</text>
                    <text x="38" y="100">I build software with a focus on clear architecture, well-designed interfaces and maintainable code.</text>
                    <text x="38" y="120">Interested in programming languages, developer tools, system design and the details that make</text>
                    <text x="38" y="140">software reliable, efficient and intuitive.</text>
                    <text x="38" y="176">I value simplicity over complexity, function over noise and thoughtful engineering over unnecessary</text>
                    <text x="38" y="196">abstractions. From low-level systems to user-facing applications, I enjoy understanding how things work.</text>
          </g>
</svg>
