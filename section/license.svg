  <rect width="830" height="230" fill="#231f29" stroke="#4c5aa8" stroke-width="2" />
  <rect class="r" x="18" y="18" width="3" height="194" fill="#f0485a" />
  <g font-size="12">
    <text x="38" y="34" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#f0485a" clip-path="url(#c0)">LICENSE: MIT / OPEN SOURCE</text>
    <text x="38" y="64" font-size="12" font-weight="normal" letter-spacing="0" fill="#cfcfd8" clip-path="url(#c1)">Software, systems and interfaces; thinking, analyzing and coding.</text>
    <text x="38" y="100" font-size="12" font-weight="normal" letter-spacing="0" fill="#cfcfd8" clip-path="url(#c2)">I build software with a focus on clear architecture, well-designed interfaces and maintainable code.</text>
    <text x="38" y="120" font-size="12" font-weight="normal" letter-spacing="0" fill="#cfcfd8" clip-path="url(#c3)">Interested in programming languages, developer tools, system design and the details that make</text>
    <text x="38" y="140" font-size="12" font-weight="normal" letter-spacing="0" fill="#cfcfd8" clip-path="url(#c4)">software reliable, efficient and intuitive.</text>
    <text x="38" y="176" font-size="12" font-weight="normal" letter-spacing="0" fill="#cfcfd8" clip-path="url(#c5)">I value simplicity over complexity, function over noise and thoughtful engineering over unnecessary</text>
    <text x="38" y="196" font-size="12" font-weight="normal" letter-spacing="0" fill="#cfcfd8" clip-path="url(#c6)">abstractions. From low-level systems to user-facing applications, I enjoy understanding how things work.</text>
  </g>
  <rect class="c" x="787" y="184" width="7" height="14" fill="#f0485a" />
