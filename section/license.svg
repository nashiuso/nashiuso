<svg xmlns="http://www.w3.org/2000/svg" width="830" height="230" viewBox="0 0 830 230" font-family="'JetBrains Mono','Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest">
  <metadata>
  </metadata>
  <style>
    .r {
      animation: p 3s ease-in-out infinite
    }

    @keyframes p {
      50% {
        opacity: .5
      }
    }

    .c {
      animation: b 1s steps(1) infinite
    }

    @keyframes b {
      50% {
        opacity: 0
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important
      }
    }
  </style>
  <defs>
    <clipPath id="c0">
      <rect x="30" y="18" width="0" height="24">
        <animate attributeName="width" from="0" to="800" dur="0.31s" begin="0.30s" fill="freeze" />
      </rect>
    </clipPath>
    <clipPath id="c1">
      <rect x="30" y="48" width="0" height="24">
