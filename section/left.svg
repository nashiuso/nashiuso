<svg xmlns="http://www.w3.org/2000/svg" width="330" height="250" viewBox="0 0 330 250" font-family="'JetBrains Mono','Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest">
  <metadata>
    <c2pa:manifest></c2pa:manifest>
  </metadata>
  <style>
    .c {
      animation: b 1s steps(1) infinite
    }

    @keyframes b {
      50% {
        opacity: 0
      }
    }

    .a {
      animation: n 3s ease-in-out infinite
    }

    @keyframes n {
      50% {
        transform: translateX(6px)
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important
      }
    }
  </style>
  <defs>
    <pattern id="s" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity=".06" />
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 4" dur="1.2s" repeatCount="indefinite" />
    </pattern>
  </defs>
  <rect width="330" height="250" fill="#231f29" stroke="#4c5aa8" stroke-width="2" />
  <rect x="16" y="16" width="298" height="136" fill="#e6e3c8" />
  <rect x="16" y="16" width="298" height="136" fill="url(#s)" />
  <text x="34" y="116" font-size="84" font-weight="900" fill="#1d1a22" letter-spacing="-4" font-family="Impact,'Arial Black',sans-serif">NU</text>
  <rect x="200" y="82" width="32" height="9" fill="#1d1a22" />
  <polygon class="a" points="244,72 292,86 244,100 244,92 270,86 244,80" fill="#1d1a22" />
  <text x="16" y="182" font-size="11" fill="#4c5aa8" letter-spacing="3">CONTACT :</text>
  <text x="16" y="208" font-size="15" font-weight="bold" fill="#f0485a">80126K@PROTON.ME</text>
  <rect class="c" x="153" y="195" width="8" height="15" fill="#f0485a" />
  <text x="16" y="236" font-size="10" fill="#4c5aa8">// open to collaborate</text>
</svg>
